name: Update Snake Heart

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

concurrency:
  group: snake-heart-output
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # Скрипт пишет assets/snake_heart.svg
      - name: Generate SVG
        run: python scripts/snake_heart.py

      - name: Prepare dist
        run: |
          mkdir -p dist
          cp assets/snake_heart.svg dist/

      - name: Publish to snake-heart-output
        uses: crazy-max/ghaction-github-pages@v4
        with:
          build_dir: dist
          target_branch: snake-heart-output
        env:
          GITHUB_TOKEN: ${{ github.token }}
