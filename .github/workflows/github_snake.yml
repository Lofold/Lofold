name: Generate GitHub Snake

on:
  schedule:
    - cron: '0 0 * * *' # раз в сутки, 00:00 UTC
  workflow_dispatch:

# Отдельная группа: этот workflow не должен ждать matrix или snake_heart.
concurrency:
  group: snake-output
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Generate snake animation
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg
            dist/github-snake-dark.svg?palette=github-dark

      # Публикует содержимое dist/ в orphan-ветку output через force-push.
      # История ветки всегда — один коммит, main не трогается.
      - name: Publish to github-snake-output
        uses: crazy-max/ghaction-github-pages@v4
        with:
          build_dir: dist
          target_branch: github-snake-output
        env:
          GITHUB_TOKEN: ${{ github.token }}
